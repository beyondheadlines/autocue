<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#000000"/>
  <rect x="24" y="24" width="464" height="464" rx="76" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.22"/>
  <!-- Dimmed top text lines -->
  <rect x="104" y="96" width="240" height="20" rx="10" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="104" y="136" width="304" height="20" rx="10" fill="#ffffff" fill-opacity="0.25"/>
  <!-- Two-line focus shade window -->
  <rect x="48" y="186" width="416" height="140" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="6"/>
  <!-- Left & right focus arrows -->
  <polygon points="68,240 88,256 68,272" fill="#ffffff"/>
  <polygon points="444,240 424,256 444,272" fill="#ffffff"/>
  <!-- Active 2 lines of text in focus -->
  <rect x="104" y="218" width="288" height="26" rx="13" fill="#ffffff"/>
  <rect x="104" y="268" width="224" height="26" rx="13" fill="#ffffff"/>
  <!-- Dimmed bottom text lines -->
  <rect x="104" y="356" width="280" height="20" rx="10" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="104" y="396" width="196" height="20" rx="10" fill="#ffffff" fill-opacity="0.25"/>
</svg>
